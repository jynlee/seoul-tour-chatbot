<h2>추천 결과 화면 · 처음 시안의 지도 스타일로</h2>
<p class="subtitle">처음 C안에서 보셨던 크림색 일러스트 지도(초록 숲 덩어리, 하늘색 강, 하얀 길, 물방울 핀 + 이름표)로 되돌렸습니다. 테두리·말풍선·입력창은 S2a 핑크 톤입니다. 핀을 눌러 보세요.</p>

<style>
  .wrap{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
  .phone{width:300px;height:620px;border:9px solid #222;border-radius:30px;overflow:hidden;position:relative;color:#333;font-size:12.5px;display:flex;flex-direction:column;background:linear-gradient(#ffe9f0,#fff6e8)}
  .top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-weight:700;font-size:13px}
  .top span:last-child{font-weight:400;color:#c07a8a;font-size:11px}
  .map{position:relative;margin:0 10px;height:260px;border-radius:22px;overflow:hidden;border:3px solid #fff;box-shadow:0 2px 8px rgba(220,120,150,.2)}
  .map svg{position:absolute;inset:0;width:100%;height:100%}
  .pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:700;color:#5a4632;cursor:pointer}
  .pin .head{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .15s}
  .pin .head span{transform:rotate(45deg);font-size:15px}
  .pin.on .head{transform:rotate(-45deg) scale(1.25)}
  .pin .lbl{margin-top:4px;background:#fff;padding:1px 7px;border-radius:8px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .pin.tour .head{background:#ff8fa3}.pin.food .head{background:#ff9f43}
  .me{position:absolute;width:14px;height:14px;border-radius:50%;background:#4f8cff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(79,140,255,.2);transform:translate(-50%,-50%)}
  .legend{position:absolute;left:8px;bottom:8px;background:#fffd;padding:3px 8px;border-radius:8px;font-size:10px;color:#5a4632}
  .card{position:relative;margin:8px 10px 0;background:#fff;border-radius:18px;box-shadow:0 6px 16px rgba(200,90,120,.15);padding:10px;display:none;gap:10px}
  .card.show{display:flex}
  .card .img{width:62px;height:62px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px}
  .card b{font-size:14px}.card .row{font-size:11.5px;color:#666;margin-top:3px}
  .card .tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:999px;margin-left:4px}
  .card .x{margin-left:auto;color:#bbb;cursor:pointer}
  .chat{flex:1;padding:6px 12px;overflow:hidden}
  .bub{padding:8px 12px;border-radius:16px;margin:6px 0;max-width:86%;line-height:1.45}
  .bub.u{background:#ff8fa3;color:#fff;margin-left:auto;border-bottom-right-radius:5px;width:fit-content}
  .bub.b{background:#fff;border-bottom-left-radius:5px;box-shadow:0 1px 0 #ffd6df}
  .inp{margin:0 10px 10px;display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:8px 12px;box-shadow:0 2px 6px rgba(0,0,0,.1);color:#aaa}
  .inp span{margin-left:auto}
</style>

<div class="wrap"><div class="phone" id="ph"></div></div>

<script>
(function(){
  var P=[
    {k:'gh',type:'tour',e:'🏯',name:'광화문',cat:'역사관광지',addr:'서울특별시 종로구 사직로 161',tel:'(예시 번호)',x:26,y:30,walk:'약 4분'},
    {k:'ks',type:'tour',e:'🌳',name:'광화문광장',cat:'관광지',addr:'서울특별시 종로구 세종대로 172',tel:'(예시 번호)',x:34,y:58,walk:'약 1분'},
    {k:'gm',type:'food',e:'🥟',name:'개성만두 궁',cat:'한식',addr:'서울특별시 종로구 인사동10길 11-3',tel:'(예시 번호)',x:76,y:44,walk:'약 12분'},
    {k:'sj',type:'food',e:'🍽️',name:'광화문 세종클럽',cat:'음식점',addr:'서울특별시 종로구 새문안로5가길 7',tel:'(예시 번호)',x:15,y:74,walk:'약 3분'}
  ];
  var svg='<svg viewBox="0 0 300 260" preserveAspectRatio="xMidYMid slice">'
   +'<rect width="300" height="260" fill="#fdf6e3"/>'
   +'<ellipse cx="55" cy="18" rx="90" ry="48" fill="#bfe0a5"/>'
   +'<circle cx="30" cy="20" r="11" fill="#8cc271"/><circle cx="56" cy="10" r="13" fill="#8cc271"/><circle cx="82" cy="22" r="10" fill="#8cc271"/>'
   +'<ellipse cx="262" cy="200" rx="60" ry="34" fill="#cfe8b8"/><circle cx="250" cy="196" r="9" fill="#8cc271"/><circle cx="272" cy="204" r="8" fill="#8cc271"/>'
   +'<path d="M0,240 C70,222 150,252 300,226 L300,260 L0,260Z" fill="#a9dbf3"/>'
   +'<path d="M30,248 q8,-5 16,0 M190,240 q8,-5 16,0" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>'
   +'<path d="M0,138 L300,124" stroke="#fff" stroke-width="13" stroke-linecap="round"/><path d="M0,138 L300,124" stroke="#f1e2c2" stroke-width="2" stroke-dasharray="7 7"/>'
   +'<path d="M104,0 L112,260" stroke="#fff" stroke-width="11"/><path d="M104,0 L112,260" stroke="#f1e2c2" stroke-width="2" stroke-dasharray="7 7"/>'
   +'<path d="M190,0 C200,80 180,160 214,260" stroke="#fff" stroke-width="7" fill="none"/>'
   +'<rect x="200" y="40" width="54" height="34" rx="10" fill="#f6d6e4"/><rect x="130" y="170" width="46" height="32" rx="9" fill="#e6dcf7"/><rect x="40" y="160" width="40" height="30" rx="8" fill="#fbe3c8"/>'
   // 경복궁 미니 일러스트
   +'<g transform="translate(150,58) scale(.55)">'
   +'<rect x="-44" y="18" width="88" height="7" rx="1.5" fill="#e4ddd0"/><rect x="-38" y="12" width="76" height="7" rx="1.5" fill="#efe9de"/><rect x="-32" y="-6" width="64" height="18" fill="#f6ead2"/>'
   +[-28,-17,-6,5,16,27].map(function(p){return '<rect x="'+p+'" y="-6" width="3" height="18" fill="#c8483b"/>'}).join('')
   +'<rect x="-32" y="-9" width="64" height="4" fill="#5fae96"/>'
   +'<path d="M-48,-11 Q-40,-9 -30,-12 L30,-12 Q40,-9 48,-11 Q42,-17 34,-21 L-34,-21 Q-42,-17 -48,-11Z" fill="#4d5a66"/>'
   +'<rect x="-22" y="-30" width="44" height="10" fill="#f6ead2"/><rect x="-22" y="-32" width="44" height="3" fill="#5fae96"/>'
   +'<path d="M-36,-32 Q-29,-30 -21,-33 L21,-33 Q29,-30 36,-32 Q30,-40 22,-44 L-22,-44 Q-30,-40 -36,-32Z" fill="#4d5a66"/></g>'
   +'<path d="M120,150 C150,140 190,110 220,112" stroke="#7a6a58" stroke-width="2" stroke-dasharray="4 5" fill="none"/>'
   +'</svg>';
  var el=document.getElementById('ph'),pins='';
  P.forEach(function(p){pins+='<div class="pin '+p.type+'" data-k="'+p.k+'" style="left:'+p.x+'%;top:'+p.y+'%"><div class="head"><span>'+p.e+'</span></div><div class="lbl">'+p.name+'</div></div>';});
  el.innerHTML='<div class="top"><span>🗺️ 서울 여행 친구</span><span>▾ 지도 접기</span></div>'
   +'<div class="map">'+svg+'<div class="me" style="left:38%;top:62%"></div>'+pins+'<div class="legend">🧡 맛집 · 🩷 관광지 · 🔵 내 위치 · ⋯ 걸어서</div></div>'
   +'<div class="card"></div>'
   +'<div class="chat"><div class="bub u">광화문 근처 맛집 추천해줘</div>'
   +'<div class="bub b">광화문 근처라면 <b>광화문 세종클럽</b>(도보 3분)과 인사동의 <b>개성만두 궁</b>(도보 12분)을 추천해요! 🥟</div></div>'
   +'<div class="inp">메시지 입력… <span>📍</span></div>';
  var card=el.querySelector('.card');
  function open(k){var p=P.filter(function(q){return q.k===k})[0],food=p.type==='food';
    el.querySelectorAll('.pin').forEach(function(n){n.classList.toggle('on',n.dataset.k===k)});
    card.innerHTML='<div class="img" style="background:'+(food?'#ffe2c4':'#ffd9e1')+'">'+p.e+'</div><div style="flex:1;min-width:0"><b>'+p.name+'</b><span class="tag" style="background:'+(food?'#fff1e0;color:#c46a12':'#ffe6ec;color:#c4506b')+'">'+p.cat+'</span>'
      +'<div class="row">📍 '+p.addr+'</div><div class="row">📞 '+p.tel+'</div><div class="row">🚶 내 위치에서 '+p.walk+'</div></div><span class="x">✕</span>';
    card.classList.add('show');
    card.querySelector('.x').onclick=function(){card.classList.remove('show');el.querySelectorAll('.pin').forEach(function(n){n.classList.remove('on')});};
  }
  el.querySelectorAll('.pin').forEach(function(n){n.onclick=function(){open(n.dataset.k)}});
  open('gm');
})();
</script>
