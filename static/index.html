<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffe9f0">
  <title>서울 여행 친구</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="app" id="app">
    <section class="home" id="home"></section>
    <section class="result" id="result" hidden></section>
    <form class="inp" id="inp" autocomplete="off">
      <input id="msg" name="message" type="text" maxlength="500" placeholder="메시지 입력…" aria-label="메시지 입력">
      <button type="button" class="gps" id="gps" aria-label="현재 위치 사용">📍</button>
    </form>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
